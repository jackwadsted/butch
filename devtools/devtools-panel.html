<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="devtools-panel.css">
</head>
<body>
  <div class="container">
    <div class="section-label">Unix timestamp</div>
    <input id="ts-input" type="text" placeholder="e.g. 1700000000 or 1700000000000" autocomplete="off" spellcheck="false">
    <div id="result" class="result-value"></div>
    <button id="copy-btn" class="copy-btn hidden">Copy</button>
  </div>
  <script src="devtools-panel.js"></script>
</body>
</html>
